# Full stack: Caddy load balancer -> 2 app replicas, migrate, postgres, redis (cache, rate limits, mail
# queue), stripe-cli. Run from the repo root:
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml up -d --scale app=4   # more replicas, Caddy picks them up
# On a server, pull a release instead: APP_VERSION=1.2.3 docker compose ... pull && ... up -d
name: nuxtjs-marketplace

x-database-url: &database-url postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/${POSTGRES_DB:-marketplace}

services:
  # One-shot: applies migrations and seeds product types, then exits; `app` waits for it.
  migrate:
    image: ghcr.io/alexgalhardo/nuxtjs-marketplace:${APP_VERSION:-latest}-migrate
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: migrate
    environment:
      NUXT_HUB_DB_DIALECT: postgresql
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  app:
    # Release images (.github/workflows/release.yml); `up --build` builds them locally instead.
    image: ghcr.io/alexgalhardo/nuxtjs-marketplace:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    # No published port: traffic enters through `lb`.
    deploy:
      replicas: 2
    environment:
      REDIS_URL: redis://redis:6379
      NUXT_STRICT_ENV: ${NUXT_STRICT_ENV:-true}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
      DATABASE_URL: *database-url
      NUXT_STRIPE_SECRET_KEY: ${NUXT_STRIPE_SECRET_KEY:-}
      NUXT_STRIPE_WEBHOOK_SECRET: ${NUXT_STRIPE_WEBHOOK_SECRET:-}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      NUXT_PLATFORM_FEE_BPS: ${NUXT_PLATFORM_FEE_BPS:-1000}
      NUXT_RESEND_API_KEY: ${NUXT_RESEND_API_KEY:-}
      NUXT_EMAIL_FROM: ${NUXT_EMAIL_FROM:-}
      NUXT_CONTACT_EMAIL: ${NUXT_CONTACT_EMAIL:-}
    # Uploaded photos and digital files (fs blob driver, see infra/docker/Dockerfile).
    volumes:
      - app-data:/app/.data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  lb:
    image: caddy:2.11.6-alpine
    ports:
      - '3000:80'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    # AOF so queued mail jobs survive a restart.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    # No published port: only `migrate` and `app` reach it, over the compose network.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-marketplace}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:v1.53.0
    command: listen --api-key ${NUXT_STRIPE_SECRET_KEY:-} --forward-to lb:80/api/stripe/webhook --skip-verify
    depends_on:
      - lb
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
  redis-data:
  caddy-data:
