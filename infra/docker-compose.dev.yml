# Services only (postgres, s3, stripe-cli): the app runs on the host with `bun run dev`.
# Run from the repo root: docker compose -f infra/docker-compose.dev.yml up -d
name: nuxtjs-marketplace-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-marketplace}']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage. MinIO stopped publishing community images in 2025; SeaweedFS
  # (Apache-2.0) runs master, volume, filer and S3 in one process and creates buckets on first write.
  s3:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-resell}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-resell-secret}
    ports:
      - '9000:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 10

  stripe-cli:
    image: stripe/stripe-cli:v1.53.0
    command: listen --api-key ${NUXT_STRIPE_SECRET_KEY:-} --forward-to host.docker.internal:3000/api/stripe/webhook --skip-verify
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres-data:
  s3-data:
