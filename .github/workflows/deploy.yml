name: deploy

# Manual: pulls a released image on the server and restarts the stack (migrations run first via
# the `migrate` service). Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# (a checkout of this repo with the production .env next to infra/docker-compose.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to deploy (e.g. 1.2.3), or latest
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Production deploys only from main (D23): dev is the sandbox.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_VERSION: ${{ inputs.version }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_VERSION
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            export APP_VERSION
            docker compose -f infra/docker-compose.yml pull migrate app
            docker compose -f infra/docker-compose.yml up -d app
