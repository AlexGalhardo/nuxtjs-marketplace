name: release

# `bun run release` (changelogen) bumps the version, writes CHANGELOG.md and tags; pushing the
# tag publishes the GitHub Release and the Docker images.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/alexgalhardo/nuxtjs-marketplace

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: github release from CHANGELOG.md
        run: bunx changelogen gh release "$GITHUB_REF_NAME" --token "${{ secrets.GITHUB_TOKEN }}"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-migrate,${{ env.IMAGE }}:latest-migrate
          cache-from: type=gha
